@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap');

.mh{
  --ink:#0E1524; --panel:#161F35; --panel-2:#1E2A46; --line:#2C3856;
  --ivory:#EDE7DA; --mute:#8D9AB8; --brass:#D8B24C;
  --t:#6FB6A6; --sd:#7E9BD4; --d:#D6455E; --vi:#A98BD8;
  background:var(--ink);color:var(--ivory);min-height:100vh;
  font-family:'IBM Plex Sans',system-ui,sans-serif;padding:24px 16px 60px;box-sizing:border-box;
}
.mh *{box-sizing:border-box;}
.wrap{max-width:1040px;margin:0 auto;}
.eyebrow{font-family:'Archivo',sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--brass);margin:0 0 9px;}
.title{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(27px,6.6vw,50px);line-height:.96;text-transform:uppercase;margin:0 0 8px;}
.title em{font-style:normal;color:var(--brass);}
.lede{color:var(--mute);font-size:13.5px;max-width:54ch;margin:0 0 20px;line-height:1.55;}

.tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:18px;}
.tab{
  font-family:'Archivo',sans-serif;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:9px;
  padding:11px 15px;cursor:pointer;min-height:42px;transition:.15s;
}
.tab:hover{color:var(--ivory);border-color:var(--brass);}
.tab:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.tab[aria-selected="true"]{background:var(--brass);color:#12182A;border-color:var(--brass);font-weight:800;}
.tabs .sp{margin-left:auto;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
.lbl{font-family:'Archivo',sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:9px;}
.row{display:flex;flex-wrap:wrap;gap:6px;}
.btn{
  font-family:'IBM Plex Mono',monospace;font-size:13px;background:var(--panel-2);color:var(--ivory);
  border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer;min-height:40px;transition:.15s;
}
.btn:hover{border-color:var(--brass);}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.btn[aria-pressed="true"]{background:var(--brass);color:#12182A;border-color:var(--brass);font-weight:600;}
.btn.wide{font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;text-align:left;}
.btn.wide small{display:block;font-size:9.5px;opacity:.62;}
.chip{
  font-family:'IBM Plex Mono',monospace;font-size:12px;background:transparent;color:var(--mute);
  border:1px solid var(--line);border-radius:20px;padding:6px 11px;cursor:pointer;min-height:34px;transition:.15s;
}
.chip:hover{color:var(--ivory);border-color:var(--brass);}
.chip:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.chip[aria-pressed="true"]{background:var(--brass);color:#12182A;border-color:var(--brass);font-weight:600;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:720px){.grid2{grid-template-columns:1fr;}}

.scale{display:flex;flex-wrap:wrap;gap:4px;}
.deg{
  flex:1 1 58px;text-align:center;padding:10px 4px;border-radius:9px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--ivory);cursor:pointer;font:inherit;min-height:54px;transition:.15s;
}
.deg:hover{background:#253354;border-color:var(--brass);transform:translateY(-2px);}
.deg:active{background:var(--brass);color:#12182A;}
.deg:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.scale.dupla .deg{flex:1 1 42px;min-height:46px;padding:7px 3px;}
.scale.dupla .deg strong{font-size:14px;}
.scale.dupla .deg.oct2{opacity:.72;}
.deg span{display:block;font-family:'Archivo',sans-serif;font-size:9.5px;letter-spacing:.2em;color:var(--mute);}
.deg strong{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500;}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px;}
@media(min-width:760px){.cards{grid-template-columns:repeat(7,1fr);gap:8px;}}
.card{
  text-align:left;background:var(--panel-2);border:1px solid var(--line);border-top-width:3px;
  border-radius:10px;padding:10px 8px 9px;color:var(--ivory);cursor:pointer;transition:.15s;
}
.card:hover{transform:translateY(-3px);background:#253354;}
.card:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:5px;}
.card .rm{font-family:'Archivo',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--mute);}
.card .nm{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--brass);}
.card .ch{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;margin:5px 0 1px;overflow-wrap:anywhere;line-height:1.15;}
.card .sv{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mute);overflow-wrap:anywhere;}
.card .fn{margin-top:7px;font-family:'Archivo',sans-serif;font-size:8.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;line-height:1.3;}
.card.oct2{opacity:.7;}
.f-T{border-top-color:var(--t);} .f-SD{border-top-color:var(--sd);} .f-D{border-top-color:var(--d);} .f-N{border-top-color:var(--line);}
.f-T .fn{color:var(--t);} .f-SD .fn{color:var(--sd);} .f-D .fn{color:var(--d);} .f-N .fn{color:var(--mute);}

.ta{
  width:100%;min-height:76px;resize:vertical;background:var(--panel-2);color:var(--ivory);
  border:1px solid var(--line);border-radius:10px;padding:12px 13px;
  font-family:'IBM Plex Mono',monospace;font-size:16px;line-height:1.7;
}
.ta:focus{outline:2px solid var(--brass);outline-offset:1px;}
.ta::placeholder{color:#5C6B8C;}

.verdict{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;}
.keybig{font-family:'Archivo',sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(24px,6vw,42px);line-height:1;color:var(--brass);}
.conf{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute);padding-bottom:3px;}
.warn{border:1px solid rgba(216,178,76,.4);background:rgba(216,178,76,.09);border-radius:10px;padding:11px 13px;color:var(--brass);font-size:12.5px;line-height:1.55;margin-top:12px;}

.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:5px;}
@media(min-width:700px){.strip{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;}}
.cell{
  background:var(--panel-2);border:1px solid var(--line);border-left-width:3px;border-radius:8px;
  padding:6px 7px 7px;color:var(--ivory);cursor:pointer;text-align:left;transition:.15s;
}
.cell:hover{background:#253354;}
.cell:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.cell[aria-pressed="true"]{background:#2A3A61;border-color:var(--brass);}
.cell .l1{display:flex;justify-content:space-between;align-items:baseline;gap:5px;}
.cell .cf{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;line-height:1.15;overflow-wrap:anywhere;}
.cell .gr{font-family:'Archivo',sans-serif;font-size:10px;font-weight:800;flex:none;}
.cell .nt{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--mute);margin-top:3px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell .rg{display:flex;gap:2.5px;margin-top:6px;}
.cell .rg i{flex:1;height:5px;border-radius:2px;background:#31406A;}
.cell .rg i.on{background:var(--brass);}
@media(min-width:700px){.cell .cf{font-size:16px;} .cell .nt{font-size:10.5px;}}

.form{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
.pill{font-family:'Archivo',sans-serif;font-size:11px;font-weight:800;width:27px;height:27px;display:flex;align-items:center;justify-content:center;border-radius:7px;color:#12182A;}
.sec{margin-bottom:16px;}
.sechd{display:flex;flex-wrap:nowrap;align-items:center;gap:7px;margin-bottom:7px;}
.sechd .chip{margin-left:auto;flex:none;padding:3px 9px;min-height:26px;font-size:10.5px;}
.secid{font-family:'Archivo',sans-serif;font-size:11px;font-weight:800;width:23px;height:23px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#12182A;flex:none;}
.secnm{font-family:'Archivo',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.secct{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mute);flex:none;}

.out{font-family:'IBM Plex Mono',monospace;font-size:clamp(14px,3.2vw,18px);font-weight:500;line-height:1.9;word-spacing:.35em;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;}
.note{color:var(--mute);font-size:12.5px;line-height:1.6;margin:12px 0 0;}
.note b{color:var(--ivory);font-weight:500;}
.legend{display:flex;flex-wrap:wrap;gap:11px;margin-top:13px;font-size:10.5px;color:var(--mute);}
.legend span{display:flex;align-items:center;gap:5px;}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;}
.det{background:var(--panel-2);border:1px solid var(--brass);border-radius:11px;padding:13px;margin-top:10px;}
.det h4{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;margin:0;}
.dethd{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.dethd .chip{margin-left:auto;}
.det .sub{font-family:'Archivo',sans-serif;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);}
.notes{display:flex;gap:4px;margin-top:6px;overflow-x:auto;padding-bottom:5px;scrollbar-width:thin;}
.nt{
  flex:0 0 auto;min-width:42px;text-align:center;padding:6px 6px;border-radius:8px;background:var(--panel);
  border:1px solid var(--line);color:var(--ivory);cursor:pointer;font:inherit;transition:.15s;
}
.nt:hover{border-color:var(--brass);}
.nt:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.nt b{display:block;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;line-height:1.2;}
.nt span{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--mute);line-height:1.3;}
.nt.acorde span{color:var(--brass);}
.nt.acorde{background:rgba(216,178,76,.16);border-color:rgba(216,178,76,.5);}
.usado{opacity:1;} .naousado{opacity:.42;}
.badge{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--brass);}
.pad{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.padc{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--brass);
  background:rgba(216,178,76,.1);border:1px solid rgba(216,178,76,.38);
  border-radius:20px;padding:4px 10px;white-space:nowrap;
}
.padl{display:flex;flex-direction:column;gap:4px;}
.padb{
  display:flex;align-items:baseline;gap:9px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:8px;padding:9px 11px;color:var(--ivory);cursor:pointer;text-align:left;transition:.15s;
}
.padb:hover{border-color:var(--brass);}
.padb:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.padb[aria-pressed="true"]{border-color:var(--brass);background:#2A3A61;}
.padb .fm{font-family:'Archivo',sans-serif;font-size:8.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);min-width:56px;flex:none;}
.padb .nm{font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;}
.scroll{overflow-x:auto;padding-bottom:6px;}
.scroll svg{display:block;}
.leg{display:flex;gap:13px;flex-wrap:wrap;font-size:10.5px;color:var(--mute);margin-top:8px;}
.leg span{display:flex;align-items:center;gap:5px;}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block;}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px;}
@media(min-width:700px){.bars{grid-template-columns:repeat(8,1fr);}}
.bar{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 3px;text-align:center;transition:.1s;}
.bar.now{background:var(--brass);border-color:var(--brass);}
.bar .c{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;}
.bar.now .c{color:#12182A;}
.bar .g{font-family:'Archivo',sans-serif;font-size:8.5px;font-weight:800;color:var(--mute);}
.bar.now .g{color:#4A3C10;}
.beats{display:flex;gap:5px;justify-content:center;margin:9px 0;}
.beats i{width:9px;height:9px;border-radius:50%;background:#31406A;}
.beats i.on{background:var(--brass);}
.agora{background:var(--panel-2);border:1px solid var(--brass);border-radius:10px;padding:11px;text-align:center;}
.agora .big{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600;line-height:1;}
.agora .sc{font-family:'Archivo',sans-serif;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--brass);margin-top:5px;}
input[type=range]{flex:1;min-width:130px;accent-color:#D8B24C;}
.gt{display:flex;gap:3px;overflow-x:auto;padding-bottom:6px;}
.gtc{flex:0 0 auto;min-width:54px;text-align:center;}
.gtc .cf{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute);margin-bottom:5px;}
.gtn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 4px;margin-bottom:3px;width:100%;color:var(--ivory);cursor:pointer;font:inherit;}
.gtn:hover{border-color:var(--brass);}
.gtn.mv{border-color:var(--brass);background:rgba(216,178,76,.12);}
.gtn b{display:block;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;}
.gtn i{display:block;font-style:normal;font-size:8.5px;color:var(--mute);font-family:'IBM Plex Mono',monospace;}
.mov{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--brass);height:12px;}
.pent{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);}
.pent:last-of-type{border-bottom:none;}
.pentg{display:flex;align-items:baseline;gap:7px;min-width:104px;flex:none;background:transparent;
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;color:var(--ivory);cursor:pointer;font:inherit;text-align:left;transition:.15s;}
.pentg:hover{border-color:var(--brass);background:var(--panel-2);}
.pentg:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.pentg .rm{font-family:'Archivo',sans-serif;font-size:11px;font-weight:800;color:var(--mute);min-width:30px;}
.pentg .cf{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;}
.pentn{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:3px 0 4px;}
.ntp{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--brass);
  background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer;
  min-height:38px;min-width:42px;text-align:center;}
.ntp i{display:block;font-style:normal;font-size:9px;font-weight:400;color:var(--mute);}
.ntp.emacorde{background:rgba(216,178,76,.18);border-color:rgba(216,178,76,.5);}
.ntp.emacorde i{color:var(--brass);}
.pentres{flex-basis:100%;font-size:11px;color:var(--mute);line-height:1.5;padding-top:2px;}
.pentres b{color:var(--ivory);font-weight:500;}
.ntp:hover{border-color:var(--brass);}
.ntp:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.nt.sel{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset;}
.afin{display:flex;flex-direction:column;gap:5px;}
.afb{display:flex;align-items:baseline;gap:12px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:9px;padding:9px 12px;color:var(--ivory);cursor:pointer;text-align:left;transition:.15s;}
.afb:hover{border-color:var(--brass);}
.afb:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.afb[aria-pressed="true"]{background:var(--brass);color:#12182A;border-color:var(--brass);}
.afb .tn{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;min-width:32px;flex:none;}
.afb .ex{font-size:11px;color:var(--mute);line-height:1.45;}
.afb[aria-pressed="true"] .ex{color:#4A3C10;}
.afn{text-align:center;padding:6px 0 2px;}
.afn .nt2{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(46px,14vw,86px);line-height:.95;}
.afn .oit{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--mute);vertical-align:super;}
.afn .hz{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--mute);}
.afn .ct{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;}
.regua{position:relative;height:44px;margin:14px 0 6px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.regua .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--t);}
.regua .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line);}
.regua .agulha{position:absolute;top:5px;bottom:5px;width:5px;margin-left:-2.5px;border-radius:3px;transition:left .13s cubic-bezier(.22,.61,.36,1),background .2s;}
.regua .esc{position:absolute;bottom:2px;font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--mute);}
.leit{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:10px;}
.leit div{text-align:center;}
.leit b{display:block;font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;}
.leit span{font-family:'Archivo',sans-serif;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);}
.foot{color:var(--mute);font-size:11px;text-align:center;margin-top:24px;}
@media(prefers-reduced-motion:reduce){.card:hover,.cell:hover,.deg:hover{transform:none;}}
